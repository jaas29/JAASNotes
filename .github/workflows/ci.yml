# Not run yet. The runner image and Xcode version must be confirmed on the owner's setup before this is trusted.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build
        run: |
          xcodebuild -project JAASNotes.xcodeproj -scheme JAASNotes -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/DerivedData build
      - name: Unit and integration tests
        run: |
          xcodebuild -project JAASNotes.xcodeproj -scheme JAASNotes -destination 'platform=macOS' -derivedDataPath .build/DerivedData -resultBundlePath .build/TestResults/unit-${{ github.run_id }}.xcresult -only-testing:JAASNotesTests test
      - name: UI tests
        run: |
          xcodebuild -project JAASNotes.xcodeproj -scheme JAASNotes -destination 'platform=macOS' -derivedDataPath .build/DerivedData -resultBundlePath .build/TestResults/ui-${{ github.run_id }}.xcresult -only-testing:JAASNotesUITests test
